# BiLSTM | time domain | cross-entropy | words
# One pooled decision per window; no decoding stage.
model:
  kind: dl
  name: speechnet
  kwargs:
    domain: "time"
    p_dropout: 0.5
    global_pool: avg
    use_bilstm: true
    rnn_hidden_dim: 128

    # Time domain (gentle pooling): 14 x T  ->  freq collapses at the "full" block,
    # time T' = T/8  (2.0 s -> 125, 1.4 s -> 87).  ch_last = 128.
    blocks_config:
      - { out_channels: 16,  kernel: [1, 5],      pool: [1, 2] }
      - { out_channels: 32,  kernel: [1, 5],      pool: [1, 2] }
      - { out_channels: 64,  kernel: [1, 5],      pool: [1, 2] }
      - { out_channels: 64,  kernel: ["full", 1], pool: [1, 1] }
      - { out_channels: 128, kernel: [1, 1],      pool: [1, 1] }

    train_cfg:
      loss_name: cross_entropy
      num_epochs: 150
      warmup_epochs: 10
      grad_clip_norm: 1.0
      optimizer_cfg: { "name": "adamw", "lr": 1e-3 }
      scheduler: { name: ReduceLROnPlateau, mode: min, factor: 0.1, patience: 12 }
      early_stop_patience: 30
      weight_decay: 1e-4
