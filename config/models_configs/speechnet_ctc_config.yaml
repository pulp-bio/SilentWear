model:
  kind: dl
  name: speechnet
  kwargs:
    p_dropout: 0.5
    global_pool: avg
    rnn_hidden_dim: 128

    blocks_config:
      - out_channels: 16
        kernel: [1, 5]
        pool: [1, 2]

      - out_channels: 32
        kernel: [1, 5]
        pool: [1, 2]

      - out_channels: 64
        kernel: [1, 5]
        pool: [1, 2]

      - out_channels: 64
        kernel: ["full", 1]
        pool: [1, 1]
      - out_channels: 128
        kernel: [1, 1]
        pool: [1, 1]

    train_cfg:
      loss_name: ctc
      ctc:
        blank_id: 0
        lexicon_path: lexicon/silentwear_lexicon_sentences.txt
        allow_nearest_word_match: true
      num_epochs: 150
      warmup_epochs: 10
      grad_clip_norm: 1.0
      optimizer_cfg: { "name": "adamw", "lr": 5e-4 } # AdamW gestisce correttamente il decadimento dei pesi
      scheduler:
        factor: 0.5
        mode: min
        name: ReduceLROnPlateau
        patience: 12
      early_stop_patience: 35
      weight_decay: 5e-3